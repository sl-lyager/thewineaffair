<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opsamling | Eventnavn</title>
  <link rel="stylesheet" href="./starter.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-content">
      <a class="site-logo" href="./">TheWineAffair</a>
      <nav class="site-nav">
        <button>Menu</button>
        <ul class="menu" id="menu" popover>
          <li><a href="./">Forside</a></li>
          <li><a href="./svg.html">Interaktiv SVG</a></li>
          <li><a href="./form.html" aria-current="page">Formular</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="opsamling-page">


      <article class="opsamling-placeholder">
        <div class="etiket-indhold">

          <p class="etiket-overtekst">DIN PERSONLIGE VINPROFIL</p>

          <h1 class="navn">Dit navn</h1>

          <div class="etiket-linje"></div>

          <p class="alder">18+</p>

          <div class="event-info">
            <p class="lokation-output">Din lokation</p>
            <p class="dato-output">Din dato</p>
          </div>

          <div class="vin-info">
            <p class="lille-overskrift">DIN FORTRUKENE VIN</p>
            <h2 class="vin-output">Rødvin</h2>
            <h2 class="niveau-output">Dit vinniveau</h2>
          </div>

          <div class="profil">
            <p class="forventninger-output">Dine forventninger</p>
            <p class="profil-output">Din personlige vinprofil</p>
          </div>

          <div class="etiket-linje"></div>

          <p class="etiket-footer">Vi glæder os til at se dig!</p>

        </div>
      </article>

      <div class="opsamling-intro">
        <div class="actions">
          <a class="button" href="./form.html">Tilbage til formular</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-content">
      <p>TheWineAffair</p>
      <p>Footer</p>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>

</html>
